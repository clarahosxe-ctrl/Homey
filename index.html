<html lang="fr">

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Homey" />
    <script>try{var r=localStorage.getItem('homey:theme');var t=r===null?'color':JSON.parse(r);if(t&&t!=='auto')document.documentElement.setAttribute('data-theme',t);var D=['sombre','nuit','amoled','color-dark','glass-dark'];var dark=D.indexOf(t)>=0||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);var m=document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]');if(m)m.setAttribute('content',dark?'black-translucent':'default')}catch(e){}</script>
    <title>Homey</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏡%3C/text%3E%3C/svg%3E" />
